name: Compile blueprint

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  # Manual runs validate the build; the pinned documentation action deploys
  # GitHub Pages only for push events.
  workflow_dispatch:

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: blueprint-${{ github.ref }}  # Group blueprint runs by ref
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    timeout-minutes: 60
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          # Avoid archiving the roughly 8.4 GB .lake directory on the hosted
          # runner; the upstream Mathlib cache already covers dependencies.
          use-github-cache: false

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          api-docs: true
          blueprint: true
          build-page: true
          deploy: true
          homepage: home_page
