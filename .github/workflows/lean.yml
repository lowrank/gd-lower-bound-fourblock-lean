name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          # The complete .lake directory is about 8.4 GB. Archiving it exhausts
          # the hosted runner's disk after a successful build, so retain only
          # mathlib's upstream cache and rebuild the project modules each run.
          use-github-cache: false

      - name: Audit theorem dependencies
        run: lake env lean AxiomAudit.lean

      - name: Reject proof placeholders and unintended declarations
        shell: bash
        run: |
          set -euo pipefail
          if rg -n --glob '*.lean' --glob '!**/.lake/**' \
            '\b(sorry|admit|axiom|unsafe|implemented_by|opaque)\b' .; then
            echo 'Found a forbidden Lean declaration or proof placeholder.' >&2
            exit 1
          fi
          if rg -n --glob '*.lean' --glob '!**/.lake/**' 'sorryAx' .; then
            echo 'Found a sorryAx dependency in project source.' >&2
            exit 1
          fi
